name: CI

on:
  pull_request:
  push:
    branches: [prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: image_upload
          POSTGRES_USER: image_upload
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U image_upload -d image_upload"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key
      POSTGRES_DB: image_upload
      POSTGRES_USER: image_upload
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MONGO_URI: mongodb://127.0.0.1:27017/image_upload
      TRUSTED_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Import contracts (ADR-015)
        run: uv run lint-imports
      - name: Django check
        run: uv run python manage.py check
      - name: Tests
        run: uv run pytest --cov --cov-report=xml
      # 비교 기준(Phase 시작 태그)·범위·기준치는 pyproject.toml [tool.diff_cover] (ADR-010)
      - name: Diff coverage
        working-directory: .
        run: uv run --project backend diff-cover backend/coverage.xml -c backend/pyproject.toml

  # Phase 1-E 게이트(장애 격리): Mongo 없이 비-mongo 테스트가 전부 green이어야 한다.
  # MONGO_URI를 닫힌 포트로 두어, mongo 마커가 빠진 테스트가 Mongo에 닿으면 실패하게 한다.
  test-without-mongo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: image_upload
          POSTGRES_USER: image_upload
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U image_upload -d image_upload"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-insecure-secret-key
      POSTGRES_DB: image_upload
      POSTGRES_USER: image_upload
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MONGO_URI: mongodb://127.0.0.1:1/test
      TRUSTED_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Tests without MongoDB
        run: uv run pytest -m "not s3 and not mongo"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run coverage
      # src/upload/ 변경 라인 커버리지 100%, 비교 기준은 Phase 시작 태그 (ADR-010)
      - name: Diff coverage
        working-directory: .
        run: |
          pipx run diff-cover frontend/coverage/cobertura-coverage.xml --compare-branch=gate/1f-start \
            --fail-under=100 --include "frontend/src/upload/**/*.ts" "frontend/src/upload/**/*.tsx"

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      # 보안·비용 설정 단언 (mock provider, AWS 자격 증명 불필요)
      - name: Terraform test
        run: terraform test
      # 허용 목록 밖 리소스 타입 금지 (ADR-014)
      - name: Resource type allowlist
        run: bash scripts/check_resource_types.sh
      - name: Checkov
        run: pipx run checkov -d . --quiet --compact --framework terraform
